<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f0b1e">
  <title>菜鸡修仙传 · 文字MUD挂机修仙</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f0b1e' stroke='%23f0c75e' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23f0c75e'%3E%E4%BB%99%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=25">
</head>
<body>
  <div id="app">
    <!-- 开始界面 -->
    <div id="start" class="pad hide">
      <div class="title-lg">菜鸡修仙传</div>
      <div class="subtitle">文字MUD · 放置修仙 · 策略战斗</div>
      <div class="panel">
        <div class="panel-title">选择你的种族</div>
        <label class="field-label">给你的道号起个名字（可选）</label>
        <input id="hero-name" class="name-input" maxlength="12" placeholder="如：白衣剑仙 / 打工人 / 青莲道人">
        <div id="race-cards" class="grid2"></div>
        <label class="field-label" style="margin-top:10px">赋予主角五行（选中后才能踏入仙途）</label>
        <div id="elem-cards" class="elems"></div>
        <div class="note">· 先选种族，再选五行，选好即可开局。<br>· 五行克制：金克木、木克土、土克水、水克火、火克金，战斗策略关键。</div>
        <div id="start-err" class="warn"></div>
        <button id="btn-start" class="btn btn-gold block" disabled>踏入仙途</button>
      </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game" class="hide">
      <header id="top">
        <div id="mytitle">
          <span id="hero-name-hdr" class="hdr-name"></span>
          <span id="vip-badge" class="vip-badge hide" data-act="vip"></span>
          <div id="hdr-res">
            <span class="res"><span class="ico">文</span>铜钱<b id="hdr-copper"></b></span>
            <span class="res"><span class="ico">▲</span>修为<b id="hdr-xiuwei"></b></span>
            <span class="res"><span class="ico">紫</span>紫气<b id="hdr-ziqi"></b></span>
          </div>
          <button id="music-btn" class="btn btn-sm" title="背景音乐">🔊</button>
        </div>
      </header>

      <div id="battle-win"></div>
      <main id="cview"></main>

      <nav id="bottomnav"></nav>
    </div>
  </div>

  <!-- 悬浮提示 -->
  <div id="toast" class="toast hide"></div>
  <audio id="bgm" src="bgm.wav" loop preload="none"></audio>

  <script src="js/data.js?v=25"></script>
  <script src="js/core.js?v=25"></script>
  <script src="js/ui.js?v=25"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f0b1e">
  <title>菜鸡修仙传 · 文字MUD挂机修仙</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f0b1e' stroke='%23f0c75e' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23f0c75e'%3E%E4%BB%99%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 开始界面 -->
    <div id="start" class="pad hide">
      <div class="title-lg">菜鸡修仙传</div>
      <div class="subtitle">文字MUD · 放置修仙 · 策略战斗</div>
      <div class="panel">
        <div class="panel-title">选择你的种族</div>
        <label class="field-label">给你的道号起个名字（可选）</label>
        <input id="hero-name" class="name-input" maxlength="12" placeholder="如：白衣剑仙 / 打工人 / 青莲道人">
        <div id="race-cards" class="grid2"></div>
        <div class="note">· 点击选中种族后查看其「普通技能 + 专属技能」。<br>· 人族控制、魔族爆发、龙人族肉盾、精灵族续航，打法各异；战斗靠速度/控制/五行/治疗以弱胜强。</div>
        <div id="start-err" class="warn"></div>
        <button id="btn-start" class="btn btn-gold block" disabled>踏入仙途</button>
      </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game" class="hide">
      <header id="top">
        <div id="mytitle"><b>菜鸡修仙传</b><span class="mt-right"><span id="realm-tag"></span><button id="music-btn" class="btn btn-sm" title="背景音乐">🔊</button></span></div>
        <div id="resbar"></div>
        <div id="stamline"></div>
      </header>

      <main id="cview"></main>

      <nav id="bottomnav"></nav>
    </div>
  </div>

  <!-- 悬浮提示 -->
  <div id="toast" class="toast hide"></div>
  <audio id="bgm" src="bgm.wav" loop preload="none"></audio>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>

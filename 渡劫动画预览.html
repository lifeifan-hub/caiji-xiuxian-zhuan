<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渡劫破境动画预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC","Microsoft YaHei","KaiTi",serif; background: radial-gradient(1000px 500px at 50% -10%, #2a2050, #0f0b1e); color: #e6d9a8; overflow: hidden; min-height: 100vh; }
    .hint { position: fixed; top: 18px; left: 0; right: 0; text-align: center; color: #a99b74; font-size: 14px; z-index: 20; }
    .btns { position: fixed; bottom: 26px; left: 0; right: 0; text-align: center; z-index: 20; }
    button { padding: 12px 26px; border-radius: 11px; border: 1px solid #f0c75e; background: linear-gradient(180deg,#f0c75e,#d9a63e); color: #2a1f00; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
    button:hover { transform: translateY(-2px); }

    .tribcine { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; background: radial-gradient(120% 80% at 50% 20%, #1a1440 0%, #08061a 60%, #03020c 100%); animation: tcIn .3s ease; }
    .tribcine.fade-out { animation: tcOut .8s ease forwards; }
    @keyframes tcIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tcOut { from { opacity: 1; } to { opacity: 0; } }
    .tc-ray { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(240,220,150,.35) 0%, rgba(240,220,150,0) 42%); animation: tcpulse 1.6s ease-in-out infinite; }
    @keyframes tcpulse { 0%,100% { opacity: .3; transform: scale(1); } 50% { opacity: .7; transform: scale(1.12); } }
    .tc-flash { position: absolute; inset: 0; background: rgba(200,220,255,.92); opacity: 0; animation: tcflash 9s step-end infinite; }
    @keyframes tcflash { 0%,14%,28%,40%,100% { opacity: 0; } 5%,20%,34% { opacity: .8; } 11%,26% { opacity: .3; } }
    .tc-bolt { position: absolute; top: 0; filter: drop-shadow(0 0 9px #cfe0ff); opacity: 0; animation: tcbolt 9s infinite; }
    @keyframes tcbolt { 0%,100% { opacity: 0; } 3% { opacity: 1; } 7% { opacity: .1; } 12% { opacity: .9; } 16% { opacity: .2; } 22% { opacity: 1; } 27% { opacity: .1; } 33% { opacity: .85; } 38% { opacity: 0; } }
    .tc-beam { position: absolute; left: 50%; bottom: 0; width: clamp(30px, 4.5vw, 60px); height: 132vh; transform: translateX(-50%) scaleY(0); transform-origin: 50% 100%; z-index: 4; opacity: 0; border-radius: 12px; background: linear-gradient(180deg, #ffffff 0%, #ffe27a 14%, #7dffab 32%, #6ec9ff 50%, #ff7a7a 68%, #e0b45f 86%, #fff4cf 100%); box-shadow: 0 0 26px rgba(190,225,255,.95), 0 0 72px rgba(150,205,255,.55); animation: tcbeam 1.6s cubic-bezier(.16,.7,.24,1) 5.2s forwards; }
    @keyframes tcbeam { 0% { opacity: 0; transform: translateX(-50%) scaleY(0); } 8% { opacity: 1; } 100% { opacity: 1; transform: translateX(-50%) scaleY(1); } }
    .tc-burst { position: absolute; left: 50%; top: 15%; width: 130px; height: 130px; transform: translate(-50%,-50%) scale(.2); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(180,225,255,.75) 34%, rgba(180,225,255,0) 68%); z-index: 5; opacity: 0; animation: tcburst 1.5s ease-out 6.8s forwards; }
    @keyframes tcburst { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); } 14% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.7); } }
    .tc-shock { position: absolute; left: 50%; top: 15%; width: 12vmin; height: 12vmin; transform: translate(-50%,-50%) scale(.1); border-radius: 50%; border: clamp(3px, .8vmin, 6px) solid rgba(205,238,255,.95); box-shadow: 0 0 30px rgba(150,210,255,.95), inset 0 0 24px rgba(150,210,255,.6); z-index: 5; opacity: 0; animation: tcshock 1.8s ease-out 6.8s forwards; }
    @keyframes tcshock { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.1); } 16% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(9); } }
    .tc-streaks i { position: absolute; bottom: -12vh; width: 2px; height: 54px; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(215,238,255,.95)); animation: tcstreak 1.4s ease-out forwards; }
    @keyframes tcstreak { from { transform: translateY(8vh); opacity: 1; } to { transform: translateY(-125vh); opacity: .2; } }
    .tc-text { position: absolute; top: 13%; width: 100%; text-align: center; z-index: 6; opacity: 0; animation: tctext 1.9s ease-out 6.9s forwards; }
    .tc-title { font-size: 42px; font-weight: 900; letter-spacing: 6px; color: #ffe9a8; text-shadow: 0 0 22px rgba(255,220,120,.9), 0 2px 6px #000; }
    .tc-sub { margin-top: 8px; font-size: 16px; color: #dbe6ff; letter-spacing: 3px; text-shadow: 0 0 10px rgba(120,160,255,.7); }
    @keyframes tctext { 0% { opacity: 0; transform: scale(.5); filter: blur(8px); } 55% { opacity: .7; } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
  </style>
</head>
<body>
  <div class="hint">渡劫破大境 · 动画预览（雷电交加 / 五彩神光冲天 / 苍穹冲击波）</div>
  <div class="btns"><button id="play">▶ 播放渡劫动画</button></div>
  <script>
    function showCine() {
      if (document.getElementById('tribcine')) return;
      let streaks=''; for(let i=0;i<12;i++){streaks+='<i style="left:'+(Math.random()*100).toFixed(1)+'%; animation-delay:'+(4.6+Math.random()*1.1).toFixed(2)+'s"></i>';}
      let bolts=''; for(let i=0;i<4;i++){const l=(8+Math.random()*84).toFixed(1),h=Math.round(150+Math.random()*150),d=(Math.random()*0.7).toFixed(2);bolts+='<svg class="tc-bolt" style="left:'+l+'%; height:'+h+'px; animation-delay:'+d+'s" width="46" viewBox="0 0 42 200"><polyline points="16,0 34,60 10,72 32,150 18,200" fill="none" stroke="#d6e8ff" stroke-width="3.5"/></svg>';}
      const d=document.createElement('div'); d.id='tribcine'; d.className='tribcine';
      d.innerHTML='<div class="tc-ray"></div><div class="tc-flash"></div>'+bolts+'<div class="tc-beam"></div><div class="tc-burst"></div><div class="tc-shock"></div><div class="tc-streaks">'+streaks+'</div><div class="tc-text"><div class="tc-title">渡劫成功</div></div>';
      document.body.appendChild(d);
      setTimeout(function(){ if(d) d.classList.add('fade-out'); },8900);
      setTimeout(function(){ if(d && d.parentNode) d.remove(); },9700);
    }
    document.getElementById('play').onclick=function(){ showCine(); };
    setTimeout(showCine, 400);
  </script>
</body>
</html>
